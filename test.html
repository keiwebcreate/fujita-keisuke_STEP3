<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link rel="stylesheet" href="test.css" />
  </head>
  <body>
    <header>
      <h1>TNG CAFE</h1>
      <p>心安らぐ一杯をあなたに</p>
      <nav>
        <ul>
          <li><a href="#about">About US</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="about">
        <h2>About US</h2>
        <p>
          TNGcafeは自然の香りに包まれたリラックス空間を提供しています。<br />自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。
        </p>
        <div>
          <img src="about.jpg" alt="カフェの写真" />
        </div>
      </section>
      <section id="menu">
        <h2>Menu</h2>
        <ul class="menu-list">
          <li>
            <img src="coffee.jpg" alt="コーヒー" width="100" height="100" />
            <p>コーヒー</p>
          </li>
          <li>
            <img src="cake.jpg" alt="ケーキ" width="100" height="100" />
            <p>ケーキ</p>
          </li>
          <li>
            <img
              src="caffe_latte.jpg"
              alt="カフェラテ"
              width="100"
              height="100"
            />
            <p>カフェラテ</p>
          </li>
        </ul>
      </section>
      <section id="contact">
        <h2>Contact</h2>
        <form action="#" method="post">
          <div class="form-row">
            <label for="name">名前：</label>
            <input type="text" id="name" name="name" />
          </div>
          <div class="form-row">
            <label for="email">メールアドレス：</label>
            <input type="email" id="email" name="email" />
          </div>
          <div class="form-row">
            <label for="content"> お問い合わせ内容： </label>
            <textarea name="content" id="content"></textarea>
          </div>
          <button type="submit" class="form-submit">送信</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Copyright &copy; 20〇〇 TNG CAFE</p>
    </footer>
  </body>
</html>
